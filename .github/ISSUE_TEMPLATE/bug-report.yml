name: Bug report
description: Something in the app isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please fill in as much as you can — even a quick description with a screenshot is a big help.

  - type: input
    id: tool
    attributes:
      label: Which tool?
      description: The name of the tool where this happens, as it appears in the app. Use "the app itself" for problems outside a tool (navigation, settings, startup).
      placeholder: e.g. Caesar Cipher, Coordinate Converter, the app itself
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in your own words. If a tool gave a wrong result, paste the input you used and the output you got.
      placeholder: |
        I tried to ... and the app ... instead of ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: The result or behaviour you were expecting. If you know the correct answer for the input above, include it.
      placeholder: |
        I expected ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, list the steps that lead to the problem.
      placeholder: |
        1. Open the app
        2. Tap on ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where are you using the app?
      description: Select every place you've seen this happen.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android (phone or tablet)
        - iOS (iPhone or iPad)
        - Web browser
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Open Settings and look under "About" — the version is shown there.
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version (optional)
      description: If you know it, the version of Windows / macOS / Android / iOS / etc. where this happens. For the web version, your browser and its version.
      placeholder: e.g. Windows 11 24H2, iOS 18, Android 14, Chrome 131

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots, recordings, or anything else
      description: Drag images or videos into this box, or paste any other details that might help.
