name: Bug report
description: Something in the app isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please fill in as much as you can — even a quick description with a screenshot is a big help.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in your own words. What did you expect to happen, and what happened instead?
      placeholder: |
        I tried to ... and the app ... instead of ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, list the steps that lead to the problem.
      placeholder: |
        1. Open the app
        2. Tap on ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where are you using the app?
      description: Select every place you've seen this happen.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android (phone or tablet)
        - iOS (iPhone or iPad)
        - Web browser
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version (optional)
      description: If you know it, the version of Windows / macOS / Android / iOS / etc. where this happens.
      placeholder: e.g. Windows 11, iOS 18, Android 14

  - type: input
    id: app-version
    attributes:
      label: App version (optional)
      description: You can usually find this on the Settings or About screen.
      placeholder: e.g. 1.2.0

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots, recordings, or anything else
      description: Drag images or videos into this box, or paste any other details that might help.
