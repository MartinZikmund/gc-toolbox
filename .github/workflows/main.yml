name: Main

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.claude/**'
      - 'LICENSE'

env:
  # App Configuration
  APP_NAME: GcToolkit
  PROJECT_FILE: src/GcToolkit/GcToolkit.csproj

  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

# Merging a second PR while the previous merge's build is still running cancels
# that stale build — main always builds its newest commit, not an outdated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # After a merge to main, build EVERY target in Release to catch Release-only
  # and platform-specific breakage the fast PR smoke can't. Each target runs on
  # its cheapest capable runner, in parallel, installing only its own workload.
  # Build-only (no signing/packaging) — shipped artifacts come from the
  # package-* / release-v* pipeline.
  release_build:
    name: Release ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: desktop,   os: ubuntu-latest,  tfm: net10.0-desktop,           workload: '' }
          - { label: wasm,      os: ubuntu-latest,  tfm: net10.0-browserwasm,       workload: wasm-tools }
          - { label: android,   os: ubuntu-latest,  tfm: net10.0-android,           workload: android }
          - { label: WinAppSDK, os: windows-latest, tfm: net10.0-windows10.0.26100, workload: '' }
          - { label: iOS,       os: macos-26,       tfm: net10.0-ios,               workload: ios,                  args: '-p:UseInterpreter=true' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history to compute the version.
          fetch-depth: 0

      - name: NuGet cache (restore)
        id: nuget
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Install only this target's workload — `workload restore` would pull the
      # union of all five heads' workloads onto a runner that builds just one.
      # Paired with -p:SingleTargetFramework below: the collapse keeps restore from
      # evaluating (and demanding workloads for) the other four TFMs.
      - name: Install ${{ matrix.workload }} workload
        if: matrix.workload != ''
        run: dotnet workload install ${{ matrix.workload }} --ignore-failed-sources

      # Ensure the iOS platform/SDK is present (newer macOS images may omit it for the
      # latest Xcode) — only download when missing. NOTE: this leg is a SIMULATOR build
      # (no -r ios-arm64); the iphoneos check is a cheap proxy for "iOS platform
      # installed" and the download is a no-op when it already is.
      - name: Download iOS platform if missing
        if: matrix.label == 'iOS'
        run: xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1 || xcodebuild -downloadPlatform iOS

      # iOS is a build-only compile check. A -c Release iOS build otherwise runs Mono
      # full AOT + IL-strip (~17 min wasted) even for the simulator, because Uno only
      # enables the interpreter for Debug. matrix.args passes -p:UseInterpreter=true for
      # iOS to skip AOT codegen (~20 min -> ~3-4 min). Real device AOT is validated
      # weekly (weekly-ios-aot.yml) and on release/v* (package-ios.yml).
      - name: Build ${{ matrix.label }} head (Release)
        run: dotnet build ${{ env.PROJECT_FILE }} -p:SingleTargetFramework=${{ matrix.tfm }} -c Release ${{ matrix.args }}

      # MTP runner — don't pass VSTest-only flags like --nologo.
      # Collapse GcToolkit.Core (referenced by the tests) to net10.0 so restore
      # doesn't wander into the other platforms' workloads.
      - name: Run unit tests
        if: matrix.label == 'desktop'
        run: |
          dotnet test tests/GcToolkit.Core.Tests/GcToolkit.Core.Tests.csproj -p:SingleTargetFramework=net10.0
          dotnet test tests/GcToolkit.SourceGenerators.Tests/GcToolkit.SourceGenerators.Tests.csproj

      # One save per runner.os so the parallel Linux legs don't race to compress the
      # same archive. Linux: desktop saves (the PR hot-path leg — pr.yml builds it too,
      # and its closure warms PRs). Windows: WinAppSDK. macOS: iOS — previously the
      # macOS cache was NEVER saved, so the iOS leg cold-restored NuGet on every
      # (10x-billed) run; now it stays warm.
      - name: NuGet cache (save)
        if: steps.nuget.outputs.cache-hit != 'true' && contains(fromJSON('["desktop","WinAppSDK","iOS"]'), matrix.label)
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}
