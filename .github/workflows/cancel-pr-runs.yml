name: Cancel PR Runs

# Cancels all queued/in-progress workflow runs for a PR the moment it is
# closed or merged — once the PR is gone, their results can't matter, and on
# private repos every cancelled minute is an unbilled minute.
#
# Uses pull_request_target (not pull_request): for fork PRs the GITHUB_TOKEN
# on pull_request events is forced read-only and `permissions: actions: write`
# is not honored, so cancellation would 403. pull_request_target runs in the
# base-repo context where the write grant works — safe here because the job
# never checks out or executes PR code.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            const closedAt = new Date(context.payload.pull_request.closed_at);

            // head_sha uniquely identifies the PR head even for fork PRs with
            // colliding branch names; event=pull_request excludes push runs on
            // the same SHA and this canceller itself (event pull_request_target).
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: headSha, event: 'pull_request', per_page: 100,
            });

            for (const run of runs) {
              if (run.status === 'completed') continue;
              // Runs created after the PR closed are close-triggered cleanup
              // (e.g. the SWA preview teardown) — leave those alone.
              if (new Date(run.created_at) >= closedAt) continue;
              core.info(`Cancelling run ${run.id} (${run.name}, ${run.status})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (e) {
                core.warning(`Could not cancel run ${run.id}: ${e.message}`);
              }
            }
