name: Build iOS Packages

on:
  # Push to main: Dev-channel build (verify-only; no signed .ipa to avoid Apple dev-provisioning overhead in the template).
  # Push to release/v*: Prod-channel signed .ipa uploaded to TestFlight (manual "Submit for Review" gate).
  # See docs/versioning.md for the full model.
  push:
    branches:
      - "main"
      - "release/v**"
  workflow_dispatch:

env:
  # App Configuration
  APP_NAME: GcToolkit
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: src/GcToolkit.slnx
  PROJECT_PATH: src/GcToolkit
  PROJECT_FILE: src/GcToolkit/GcToolkit.csproj
  IOS_TARGET_FRAMEWORK: net10.0-ios

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_ios:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - name: Compute app channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "value=Prod" >> "$GITHUB_OUTPUT"
          else
            echo "value=Dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}

      # `workload restore` (not a hardcoded `install ios`) on purpose: the
      # ios-family workload set shifts across SDK versions and hardcoding it
      # risks NETSDK1147 on a clean runner.
      - name: Install .NET workloads
        run:
          dotnet workload restore "${{ env.SOLUTION_FILE }}"

      - name: Select Xcode Latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # This device-only build needs the iphoneos SDK, not the simulator
      # runtime — download the platform only when the SDK is actually missing
      # (newer macOS images deliberately ship without platform components for
      # the latest Xcodes; see actions/runner-images#13275 discussion).
      - name: Download iOS Platform if missing
        run: xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1 || xcodebuild -downloadPlatform iOS

      # --- Code signing: import Apple Distribution cert into a temp keychain ---
      - name: Import signing certificate
        if: steps.channel.outputs.value == 'Prod'
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      # --- Provisioning profile install (App Store) ---
      - name: Install provisioning profile
        if: steps.channel.outputs.value == 'Prod'
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles"

      # No explicit restore — the publish/build steps restore implicitly.

      # Build an archive and produce a signed .ipa
      - name: Publish iOS (signed .ipa, Prod)
        if: steps.channel.outputs.value == 'Prod'
        run: |
          dotnet publish "${{ env.PROJECT_FILE }}" -c Release -f ${{ env.IOS_TARGET_FRAMEWORK }} -r ios-arm64 \
            -p:SingleTargetFramework=${{ env.IOS_TARGET_FRAMEWORK }} \
            -p:AppChannel=Prod \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:CodesignKey="${{ secrets.APPLE_CODESIGN_KEY }}" \
            -p:CodesignTeamId="${{ secrets.APPLE_TEAM_ID }}" \
            -p:CodesignProvision="${{ secrets.APPLE_PROVISIONING_PROFILE_UUID }}"

      - name: Build iOS (verify-only, Dev)
        if: steps.channel.outputs.value == 'Dev'
        run: |
          dotnet build "${{ env.PROJECT_FILE }}" -c Release -f ${{ env.IOS_TARGET_FRAMEWORK }} \
            -p:SingleTargetFramework=${{ env.IOS_TARGET_FRAMEWORK }} \
            -p:AppChannel=Dev

      - name: Upload .ipa
        if: steps.channel.outputs.value == 'Prod'
        uses: actions/upload-artifact@v4
        with:
          name: iOS_IPA
          path: |
            ${{ env.PROJECT_PATH }}/bin/Release/${{ env.IOS_TARGET_FRAMEWORK }}/ios-arm64/publish/*.ipa
      
      - name: Upload to TestFlight
        if: steps.channel.outputs.value == 'Prod'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: "${{ env.PROJECT_PATH }}/bin/Release/${{ env.IOS_TARGET_FRAMEWORK }}/ios-arm64/publish/${{ env.APP_NAME }}.ipa"
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}