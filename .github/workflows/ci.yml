name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**

env:
  # App Configuration
  APP_NAME: GcToolkit
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: src/GcToolkit.slnx
  PROJECT_PATH: src/GcToolkit
  PROJECT_FILE: src/GcToolkit/GcToolkit.csproj
  
  STEP_TIMEOUT_MINUTES: 60

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke_test:
    name: Smoke Test (Debug Build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache NuGet to speed up restores
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-          

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}

      # Smoke-build only the workload-free heads (desktop + WinAppSDK); the mobile/WASM
      # heads are covered by their packaging workflows and would need slow workload installs.
      - name: Build ${{ env.APP_NAME }} desktop head (Debug)
        shell: pwsh
        run: dotnet build $env:PROJECT_FILE -f net10.0-desktop -c Debug

      - name: Build ${{ env.APP_NAME }} WinAppSDK head (Debug)
        shell: pwsh
        run: dotnet build $env:PROJECT_FILE -f net10.0-windows10.0.26100 -c Debug
