name: Azure Static Web Apps CI/CD

# Push to release/v*: Prod-channel WASM deployed to the production Static Web App.
# PR to main: Dev-channel WASM deployed to an Azure SWA preview environment (public repos only).
# See docs/versioning.md for the full model.
on:
  push:
    branches:
      - "release/v**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  # App Configuration
  APP_NAME: GcToolkit
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: src/GcToolkit
  WASM_TARGET_FRAMEWORK: net10.0-browserwasm

  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    # Release pushes always deploy (Prod). PR previews (Dev) only on public repos, so
    # private forks don't burn paid Actions minutes on a throwaway preview every push.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build and Deploy Job
    steps:
      - name: Compute app channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            echo "value=Prod" >> "$GITHUB_OUTPUT"
          else
            echo "value=Dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs only restore the NuGet cache (a PR-saved cache is scoped to its own
      # merge ref); release pushes maintain the shared cache.
      - name: NuGet cache (restore)
        id: nuget
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Only wasm-tools — `workload restore` would also pull the android/ios
      # workloads this WASM-only build never uses. SingleTargetFramework collapses
      # restore to wasm so it doesn't evaluate (and demand workloads for) the others.
      - name: Publish WASM
        run: |
          cd ${{ env.PROJECT_PATH }}
          dotnet workload install wasm-tools
          dotnet publish -c Release -f ${{ env.WASM_TARGET_FRAMEWORK }} -p:SingleTargetFramework=${{ env.WASM_TARGET_FRAMEWORK }} -p:AppChannel=${{ steps.channel.outputs.value }}

      - name: NuGet cache (save)
        if: github.event_name == 'push' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          skip_app_build: true
          # Allows CI to pass when no deployment token is configured (e.g. forks or the template repo).
          # Configure the AZURESTATICWEBAPPSDEPLOYMENTTOKEN secret to enable actual deployment.
          skip_deploy_on_missing_secrets: true
          azure_static_web_apps_api_token: ${{ secrets.AZURESTATICWEBAPPSDEPLOYMENTTOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/${{ env.PROJECT_PATH }}/bin/Release/${{ env.WASM_TARGET_FRAMEWORK }}/publish/wwwroot" # App source code path
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          skip_deploy_on_missing_secrets: true
          azure_static_web_apps_api_token: ${{ secrets.AZURESTATICWEBAPPSDEPLOYMENTTOKEN }}
          action: "close"
          app_location: "/${{ env.PROJECT_PATH }}/bin/Release/${{ env.WASM_TARGET_FRAMEWORK }}/publish/wwwroot"
