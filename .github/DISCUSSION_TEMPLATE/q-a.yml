name: Q&A
description: Ask a question about GC Toolkit
body:
  - type: markdown
    attributes:
      value: |
        Ask away — questions about how a tool works, which tool fits a puzzle, or how to build the app yourself are all welcome.
        Found a bug or have a feature idea? Please [open an issue](https://github.com/MartinZikmund/gc-toolbox/issues/new/choose) instead.

  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: |
        Be as specific as you can. If a tool isn't giving the result you expect, include the input you entered and the output you got.
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Which tool? (optional)
      description: The name of the tool your question is about, as it appears in the app. Leave blank for general questions.
      placeholder: e.g. Caesar Cipher, Coordinate Converter

  - type: dropdown
    id: platform
    attributes:
      label: Where are you using the app? (optional)
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android (phone or tablet)
        - iOS (iPhone or iPad)
        - Web browser

  - type: input
    id: app-version
    attributes:
      label: App version (optional)
      description: Open Settings and look under "About" — the version is shown there.
      placeholder: e.g. 1.2.0

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or anything else (optional)
      description: Drag images into this box, or paste any other details that help explain the question.
